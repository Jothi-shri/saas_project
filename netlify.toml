# Netlify deployment for the Vite/React frontend.
# Backend (FastAPI) is hosted separately; its URL is injected at build
# time via the VITE_API_URL environment variable (see frontend/.env.example).
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Production backend (Render). Netlify dashboard env vars override this if set.
[build.environment]
  VITE_API_URL = "https://saas-project-83ur.onrender.com"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
